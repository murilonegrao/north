# Shape only (record 0007). The SMTP login of the sending mailbox. Seal it without writing the
# password to disk, from k3s-gitops (the password is read from the terminal):
#   read -rsp "SMTP password: " P; echo
#   kubectl -n north create secret generic north-smtp \
#     --from-literal=NORTH_SMTP_USERNAME=north@harpia.info --from-literal=NORTH_SMTP_PASSWORD="$P" \
#     --dry-run=client -o yaml | scripts/selar.sh north north-smtp manifests/north -
#   unset P
apiVersion: v1
kind: Secret
metadata:
  name: north-smtp
  namespace: north
type: Opaque
stringData:
  NORTH_SMTP_USERNAME: ""
  NORTH_SMTP_PASSWORD: ""
